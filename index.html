<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arkitekt</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/game/style.css" />
  </head>
  <body>
    <aside id="sidebar"></aside>
    <main id="main" data-layout="split">
      <div class="layout-switch" role="group" aria-label="Layout" data-i18n-label="layout">
        <button type="button" data-layout="plan" data-i18n="layoutPlan">Plan</button>
        <button type="button" data-layout="split" data-i18n="layoutSplit">Split</button>
        <button type="button" data-layout="3d" data-i18n="layout3d">3D</button>
      </div>
      <div id="plan" class="pane"></div>
      <div id="view3d" class="pane">
        <canvas id="view"></canvas>
        <div id="view-toggles" class="view-toggles"></div>
        <div class="pane-hint" data-i18n-html="viewHint">Drag to orbit · right-drag to pan · wheel to zoom · <kbd>1</kbd>–<kbd>4</kbd> preset views · <kbd>G</kbd> plot guides</div>
      </div>
    </main>
    <section id="captures" class="overlay" hidden></section>
    <div id="modal" hidden></div>
    <script type="module" src="/src/game/main.ts"></script>
  </body>
</html>
