<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Architect</title>
    <link rel="stylesheet" href="/src/game/style.css" />
  </head>
  <body>
    <aside id="sidebar"></aside>
    <main id="main" data-layout="split">
      <div class="layout-switch" role="group" aria-label="Layout">
        <button type="button" data-layout="plan">Plan</button>
        <button type="button" data-layout="split">Split</button>
        <button type="button" data-layout="3d">3D</button>
      </div>
      <div id="plan" class="pane"></div>
      <div id="view3d" class="pane">
        <canvas id="view"></canvas>
        <button type="button" id="roof-toggle" class="pane-button" title="Show or hide the roof to look inside (H)">Roof <kbd>H</kbd></button>
        <div class="pane-hint">Drag to orbit · right-drag to pan · wheel to zoom · <kbd>1</kbd>–<kbd>4</kbd> preset views · <kbd>G</kbd> plot guides</div>
      </div>
    </main>
    <section id="captures" class="overlay" hidden></section>
    <div id="modal" hidden></div>
    <script type="module" src="/src/game/main.ts"></script>
  </body>
</html>
